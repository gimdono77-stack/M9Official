<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7faf5">
<title>ဆက်သွယ်ရန်</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;background:#f7faf5;font-family:"Noto Sans Myanmar","Myanmar Text",Arial,sans-serif;overflow:hidden}
.home{min-height:100vh;display:grid;place-items:center;position:relative;isolation:isolate;padding:24px;background:radial-gradient(ellipse at 50% 46%,#fff 0%,#fff 25%,transparent 67%),linear-gradient(135deg,#f7faf5 0%,#edf5e9 100%)}
.temples{position:absolute;inset:auto 0 0;width:100%;height:min(42vh,330px);z-index:-1;opacity:.13;color:#3c8051;pointer-events:none}
.contact{display:inline-flex;align-items:center;justify-content:center;gap:18px;width:min(440px,92vw);min-height:94px;padding:22px 34px;border:1px solid #247548;border-radius:16px;background:#25834e;color:#fff;text-decoration:none;font-size:clamp(22px,3vw,30px);font-weight:700;box-shadow:0 12px 28px rgba(37,131,78,.18);transition:background .18s,transform .18s,box-shadow .18s}
.contact:hover{background:#1e7042;transform:translateY(-2px);box-shadow:0 16px 32px rgba(37,131,78,.24)}
.contact:focus-visible{outline:3px solid #9cc9a9;outline-offset:5px}
.arrow{font-family:Arial,sans-serif;font-size:30px;font-weight:400}
@media(max-width:480px){.contact{min-height:78px;border-radius:13px;gap:13px;padding:18px 22px}.arrow{font-size:25px}.temples{height:28vh}}
@media(prefers-reduced-motion:reduce){.contact{transition:none}}
</style>
</head>
<body>
<main class="home">
